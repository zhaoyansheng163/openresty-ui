# worker 运行用户。部署在 /root 等仅 root 可读的目录下时必须为 root；
# 生产环境建议部署到 /opt 等目录并改用专用低权用户（如 user welb;）
user  root;
worker_processes  2;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/json;
    access_log    off;

    lua_package_path  "$prefix/lua/?.lua;;";

    # 动态节点表:  ups:{name} = JSON [{host, port, weight, manual_down}]
    lua_shared_dict upstream_nodes  5m;
    # 健康检查状态: hc:{host}:{port} = JSON {fail, ok, down}
    lua_shared_dict node_health     5m;
    # 加权轮询计数器
    lua_shared_dict rr_counter      1m;

    # 首次启动从 data/upstreams.json 恢复节点表；启动主动健康检查
    init_worker_by_lua_file  lua/init_worker.lua;

    # 唯一的动态 upstream：balancer 按 URI 前缀自动选择节点表。
    # 路由约定（免 reload，页面/接口新增 upstream 名后立即生效）：
    #   /{upstream名}/...   -> 使用该名字的节点表（需已通过管理接口登记）
    #   /（无前缀）          -> 默认 upstream "backend"
    #   /{未登记的名字}/...  -> 502（error.log 有明确记录）
    # 如需路径与 upstream 强绑定的传统用法，可另加 upstream 块并用
    # balancer_by_lua_block { require("balancer").run("名字") } + proxy_pass 引用，
    # 两种方式可并存。
    upstream dyn_ups {
        server 0.0.0.0:1;   # 占位，balancer 接管后永远不会被选中
        balancer_by_lua_block {
            require("balancer").run_auto()
        }
    }

    # ---------------- 业务入口 ----------------
    server {
        listen 8080;

        location / {
            proxy_pass http://dyn_ups;
            proxy_next_upstream error timeout;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_connect_timeout  3s;
            proxy_read_timeout     10s;
        }
    }

    # ---------------- 内部管理入口 ----------------
    server {
        listen 8081;

        # 管理口令，部署时务必修改；Lua 侧校验请求头 X-Auth-Token
        set $inner_token "dyn-ups-inner-token";

        # 生产环境建议放开 IP 白名单:
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;

        location /nginx_inner/ {
            content_by_lua_file  lua/upstream_api.lua;
        }
    }
}
