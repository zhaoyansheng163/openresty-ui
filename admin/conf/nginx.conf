# Web 管理端：静态单页 + Lua API，实例列表持久化在 data/instances.json。
# 登录用户与角色配置在 conf/users.json（每次登录时读取，改完即生效，无需 reload）。
# 单 worker：管理面写文件为阻塞 IO，单 worker 内不会交错，无需额外锁。

# worker 运行用户。部署在 /root 等仅 root 可读的目录下时必须为 root；
# 生产环境建议部署到 /opt 等目录并改用专用低权用户（如 user welb;）
user  root;
worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/json;
    access_log    off;

    # 管理页面静态文件所需 MIME 类型
    types {
        text/html                html htm;
        text/css                 css;
        application/javascript   js mjs;
        application/json         json;
        image/svg+xml            svg;
        image/png                png ico;
        text/plain               txt map;
    }

    lua_package_path  "$prefix/lua/?.lua;;";

    # 登录 session（cookie -> 用户/角色）
    lua_shared_dict admin_sessions    5m;
    # 登录失败限速（按 IP 计数）
    lua_shared_dict admin_login_limit 1m;

    server {
        listen 8088;

        # 管理页面
        location / {
            root   html;
            index  index.html;
        }

        # 管理 API
        location /api/ {
            content_by_lua_file  lua/admin_api.lua;
        }
    }
}
